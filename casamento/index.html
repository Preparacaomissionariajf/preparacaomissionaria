<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fernando &amp; Larissa</title>
<meta name="theme-color" content="#f6ecdf">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Pinyon+Script&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="home" class="lock">
<div class="intro" id="intro"></div>
<main>
  <section class="hero">
    <span class="fl fl-tl"></span><span class="fl fl-br"></span>
    <div>
      <p class="eyebrow">vamos nos casar</p>
      <h1 id="names"></h1>
      <div class="divider" id="dv"></div>
      <p class="meta" id="meta"></p>
      <a class="scrollhint" href="#juntos">nossa história</a>
    </div>
  </section>

  <section id="juntos" style="padding-top:20px">
    <div class="wrap">
      <div class="timer paper">
        <p class="eyebrow">juntos há</p>
        <div class="units" id="units"></div>
        <div class="divider" id="dv2"></div>
        <p class="countdown" id="countdown"></p>
      </div>
    </div>
  </section>

  <section id="historia">
    <div class="wrap">
      <div class="story-head">
        <p class="eyebrow">nossa história</p>
        <h2 class="script">Um mapa de nós dois</h2>
        <div class="divider" id="dv3"></div>
        <p class="lede" id="storyIntro"></p>
      </div>
      <div class="mapbox"><div class="mapinner" id="map"></div></div>
      <p class="maphint">toque nos ícones do mapa</p>
      <div class="cta-row">
        <a class="btn" href="programacao.html">Ver programação</a>
        <a class="btn ghost" href="presenca.html">Confirmar presença</a>
      </div>
    </div>
  </section>
</main>
<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script src="js/home.js"></script>
